name: CI
# This concurrency block definition ensures that
# only a single instance of this workflow can be
# be running at any given time for a given
# source (i.e. head) branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  pull-requests: write
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@6bd8b7f7774af54e05809fcc5431931b3eb1ddee # v4.0.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RoutingPatternsDemo.slnx

      - name: Build
        run: dotnet build RoutingPatternsDemo.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RoutingPatternsDemo.UnitTests/RoutingPatternsDemo.UnitTests.csproj --configuration Release --no-build --logger "junit;LogFileName=test-results.xml" --results-directory ./TestResults

      - name: Publish test report to PR Checks
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: API Tests
          path: TestResults/**/*.xml
          reporter: java-junit
          fail-on-error: false
